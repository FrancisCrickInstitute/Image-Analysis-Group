name: Check links
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'   # Weekly on Mondays at 06:00 UTC
  workflow_dispatch:      # Lets you run it manually from the Actions tab
jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write       # Needed only for the scheduled issue-creation step
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --max-concurrency 4
            './**/*.md'
            './**/*.html'
            './**/*.sh'
            './**/*.py'
            './**/*.ijm'
            './**/*.groovy'
            './**/*.R'
            './**/*.yml'
            './**/*.yaml'
          fail: true        # Fail the workflow on broken links
          # lychee writes its own section to the Summary tab automatically

      - name: Check file URLs don't return HTML
        id: urlcheck
        if: always()        # run even if lychee failed, so both sections appear
        run: python3 .github/scripts/check_url_content.py .

      # Combine both reports into one file for the scheduled issue
      - name: Build combined report
        if: failure() && github.event_name == 'schedule'
        run: |
          {
            echo "## Broken links (lychee)"
            echo
            cat ./lychee/out.md 2>/dev/null || echo "_No lychee report produced._"
            echo
            cat ./url-content-report.md 2>/dev/null || echo "_No URL content report produced._"
          } > ./combined-report.md

      - name: Create issue from combined report
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Link check problems
          content-filepath: ./combined-report.md
          labels: broken-links, automated
