name: Check links

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  schedule:
    - cron: '0 6 * * 1'   # Weekly on Mondays at 06:00 UTC
  workflow_dispatch:      # Lets you run it manually from the Actions tab

jobs:
  link-check:
    runs-on: ubuntu-latest
    permissions:
      issues: write       # Needed only for the scheduled issue-creation step
    steps:
      - uses: actions/checkout@v4

      - name: Run lychee
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --verbose
            --no-progress
            --accept 200,206,429
            --max-concurrency 4
            './**/*.md'
            './**/*.html'
            './**/*.sh'
            './**/*.py'
            './**/*.ijm'
            './**/*.groovy'
            './**/*.R'
            './**/*.yml'
            './**/*.yaml'
          fail: true       # Fail the workflow on broken links (red ✗ on the commit)

      # Optional: open an issue when the *scheduled* run finds problems,
      # so you hear about external link rot without it blocking PRs.
      - name: Create issue from broken-link report
        if: failure() && github.event_name == 'schedule'
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: Broken links found
          content-filepath: ./lychee/out.md
          labels: broken-links, automated
