title: Image Analysis Group
description: Software instructions and training material for bioimage analysis at the Francis Crick Institute
url: https://franciscrickinstitute.github.io
baseurl: /Image-Analysis-Group

remote_theme: just-the-docs/just-the-docs

search_enabled: true
