title: Image Analysis Group
description: Software instructions and training material for bioimage analysis at the Francis Crick Institute
url: https://franciscrickinstitute.github.io
baseurl: /Image-Analysis-Group

remote_theme: just-the-docs/just-the-docs

search_enabled: true
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

# Hide every page from the sidebar by default, then opt the curated
# documentation pages back in via front matter. This keeps the training
# course content (which lives in the same tree) out of the navigation.
defaults:
  - scope:
      path: ""
    values:
      nav_exclude: true

# Keep the large binary course/training data out of the GitHub Pages build.
# These folders hold .tif images, presentations and notebooks that users
# download from the repo (raw URLs) rather than read on the site. Deploying
# them inflates the site to ~1.8 GB and times out the deploy step.
exclude:
  - software_instructions/CellProfiler/CellProfilerCourse
  - software_instructions/StarDist/Course_Data
  - software_instructions/StarDist/StarDist_Course_Feb_2024
  - software_instructions/StarDist/Example_Data
  - software_instructions/StarDist/Presentations
